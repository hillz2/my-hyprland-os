# windowrule Position
windowrule {
  name = windowrule-1
  center = on
  float = on
  match:class = ^(pavucontrol|org.pulseaudio.pavucontrol|com.saivert.pwvucontrol)$
}

windowrule {
  name = windowrule-2
  center = on
  workspace = 7
  opacity = 0.9 0.7
  size = (monitor_w*0.6) (monitor_h*0.7)
  match:class = ^([Ww]hatsapp-for-linux)$
}

windowrule {
  name = windowrule-3
  center = on
  workspace = 7
  float = on
  opacity = 0.9 0.7
  size = (monitor_w*0.6) (monitor_h*0.7)
  match:class = ^([Ff]erdium)$
}


# WINDOWRULE v2
# windowrule v2 - position
# windowrulev2 = center,floating:1 # warning, it cause even the menu to float and center.
windowrule {
  name = windowrule-4
  center = on
  float = on
  size = (monitor_w*0.65) (monitor_h*0.9)
  match:title = ^(KooL Quick Cheat Sheet)$
}

windowrule {
  name = windowrule-5
  center = on
  float = on
  match:class = ([Tt]hunar)
  match:title = (File Operation Progress)
}

windowrule {
  name = windowrule-6
  center = on
  float = on
  match:class = ([Tt]hunar)
  match:title = (Confirm to replace files)
}

windowrule {
  name = windowrule-7
  center = on
  float = on
  size = (monitor_w*0.6) (monitor_h*0.7)
  match:title = ^(ROG Control)$
}

windowrule {
  name = windowrule-8
  center = on
  match:title = ^(Keybindings)$
}

windowrule {
  name = windowrule-9
  move = ((monitor_w*0.72)) ((monitor_h*0.07))
  float = on
  opacity = 0.95 0.75
  pin = on
  keep_aspect_ratio = on
  match:title = ^(Picture-in-Picture)$
}

#windowrulev2 = move 72% 7%,title:^(Firefox)$ 

# windowrule v2 to avoid idle for fullscreen apps
windowrule {
  name = windowrule-10
  idle_inhibit = fullscreen
  match:class = ^.*$
}

windowrule {
  name = windowrule-11
  idle_inhibit = fullscreen
  match:title = ^.*$
}

windowrule {
  name = windowrule-12
  idle_inhibit = fullscreen
  match:fullscreen = 1
}



name: my-hyprland-os
description: Lightweight Custom ublue-os base with Hyprland
base-image: ghcr.io/ublue-os/base-main
image-version: 44

modules:
  # 1. Enable COPRs
  - type: script
    scripts:
      - enable_copr.sh
      - install_wallust.sh

  # 2. Pre-fetch newer display library from testing
  - type: script
    snippets:
      - rpm-ostree install --enablerepo=updates-testing libdisplay-info

  # 3. Install RPM Packages (Trimmed & Optimized)
  - type: rpm-ostree
    install:
      # --- Core & Shell ---
      - git
      - wget
      - aria2
      - bootc
      - tmux
      - zsh
      - zsh-autosuggestions
      - zsh-syntax-highlighting
      - vim-enhanced
      - htop
      - distrobox
      - fastfetch
      - jq
      - parallel
      - tealdeer
      - libnotify
      - dbus-tools

      # --- Hyprland Ecosystem (Bluetooth removed) ---
      - hyprland
      - hyprpaper
      - hyprlock
      - hypridle
      - hyprland-guiutils
      - waybar
      - rofi-wayland
      - swaync
      - wlogout
      - grim
      - slurp
      - wl-clipboard
      - swappy
      - cliphist
      - nwg-displays
      - nwg-look
      - hyprpolkitagent
      - network-manager-applet
      # - blueman (Removed)

      # --- Theming (Minimal Dark) ---
      - adw-gtk3-theme
      - qt5-qtwayland
      - qt6-qtwayland
      - qt6ct

      # --- Networking ---
      - tailscale
      - iperf3

      # --- GUI Applications ---
      - xarchiver
      - mpv
      - eog
      - pavucontrol
      - brightnessctl
      - playerctl
      - pamixer
      - yad
      - geany

      # --- Essential Base Dependencies ---
      - thunar
      - gvfs
      - gvfs-mtp
      - gvfs-smb
      - gnome-keyring
      - kitty
      - polkit
      - xdg-user-dirs

      # --- Portals ---
      - xdg-desktop-portal-hyprland
      - xdg-desktop-portal-gtk

      # --- Archives & Thumbnails ---
      - unzip
      - unrar
      - zip
      - p7zip
      - p7zip-plugins
      - tar
      - xz
      - bzip2
      - gzip
      - ffmpegthumbnailer

      # --- Codecs & Multimedia ---
      - gstreamer1-plugins-ugly-free
      - gstreamer1-plugins-bad-free-extras
      - ffmpeg
      - gstreamer1-plugin-openh264

      # --- Fonts ---
      - google-noto-emoji-fonts
      - rsms-inter-fonts
      - google-noto-sans-cjk-fonts

      # --- Sound ---
      - pipewire
      - wireplumber
      - pipewire-alsa
      - pipewire-pulseaudio
      - pipewire-utils

      # --- Network (Bluetooth packages bluez/bluez-cups removed) ---
      - NetworkManager
      - NetworkManager-tui
      - NetworkManager-wifi

      # --- System Diagnostics ---
      - smartmontools
      - wf-recorder
      - android-tools

  # 4. Copy Config Files
  - type: files
    files:
      - source: system
        destination: /

  # 5. Flatpak Configuration
  - type: default-flatpaks
    configurations:
      - container: system
        notify: false
        install:
          - com.github.tchx84.Flatseal
          - org.mozilla.firefox
          - org.gnome.Calculator

  # 6. Fonts
  - type: fonts
    fonts:
      nerd-fonts:
        - JetBrainsMono

  # 7. Systemd Services (SDDM & Tailscale disabled)
  - type: systemd
    system:
      enabled:
        - NetworkManager
      disabled:
        - tailscaled
        - bluetooth

  # 8. Customize OS Name
  - type: os-release
    properties:
      NAME: "GalihOS"
      PRETTY_NAME: "GalihOS (Lightweight Hyprland) x86_64"
      ID: "galihos"
      ID_LIKE: fedora
      VERSION_ID: "44"
      VARIANT: "Hyprland Edition"
      VARIANT_ID: "hyprland"
      DEFAULT_HOSTNAME: "GalihOS"

  # 9. Sign image
  - type: signing

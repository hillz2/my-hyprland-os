name: my-hyprland-os
description: Lightweight Custom ublue-os base with Hyprland
base-image: ghcr.io/ublue-os/base-main
image-version: 45

modules:
  # 1. Enable COPRs
  - type: script
    scripts:
      - enable_copr.sh
      - install_wallust.sh

  # 2. libdisplay-info is already current in F45 stable (0.3.0-2), so the
  #    old updates-testing pre-fetch is no longer needed.

  # 3. Install RPM Packages (Trimmed & Optimized)
  - type: rpm-ostree
    install:
      # --- Core & Shell ---
      - git
      - gh
      - wget1-wget # F45 retired wget; shim provides /usr/bin/wget
      - aria2
      - bootc
      - tmux
      - zsh
      - zsh-autosuggestions
      - zsh-syntax-highlighting
      - vim-enhanced
      - htop
      - distrobox
      - fastfetch
      - jq
      - parallel
      - tldr # tealdeer is not packaged in F45
      - libnotify
      - dbus-tools

      # --- Hyprland Ecosystem (Bluetooth removed) ---
      - hyprland
      - hyprpaper
      - hyprlock
      - hypridle
      - hyprland-guiutils
      - waybar
      - rofi # F45 rofi 2.0 includes the Wayland backend
      - SwayNotificationCenter # provides swaync
      - wlogout
      - grim
      - slurp
      - wl-clipboard
      - swappy
      - cliphist
      - nwg-displays
      - nwg-look
      - hyprpolkitagent
      - network-manager-applet
      # - blueman (Removed)

      # --- Theming (Minimal Dark) ---
      - adw-gtk3-theme
      - qt5-qtwayland
      - qt6-qtwayland
      - qt6ct

      # --- Networking ---
      - tailscale
      - iperf3

      # --- GUI Applications ---
      - xarchiver
      - mpv
      - eog
      - pavucontrol
      - brightnessctl
      - playerctl
      - pamixer
      - yad
      - geany

      # --- Essential Base Dependencies ---
      - thunar
      - gvfs
      - gvfs-mtp
      - gvfs-smb
      - gnome-keyring
      - kitty
      - polkit
      - xdg-user-dirs

      # --- Portals ---
      - xdg-desktop-portal-hyprland
      - xdg-desktop-portal-gtk

      # --- Archives & Thumbnails ---
      - unzip
      - unrar
      - zip
      - 7zip # replaces p7zip in F45
      - 7zip-standalone-all # replaces p7zip-plugins (7zz, all formats)
      - tar
      - xz
      - bzip2
      - gzip
      - ffmpegthumbnailer

      # --- Codecs & Multimedia ---
      - gstreamer1-plugins-ugly-free
      - gstreamer1-plugins-bad-free-extras
      - ffmpeg
      - gstreamer1-plugin-openh264

      # --- Fonts ---
      - google-noto-emoji-fonts
      - rsms-inter-fonts
      - google-noto-sans-cjk-fonts

      # --- Sound ---
      - pipewire
      - wireplumber
      - pipewire-alsa
      - pipewire-pulseaudio
      - pipewire-utils

      # --- Network (Bluetooth packages bluez/bluez-cups removed) ---
      - NetworkManager
      - NetworkManager-tui
      - NetworkManager-wifi

      # --- System Diagnostics ---
      - smartmontools
      - wf-recorder
      - android-tools

  # 4. Pin Hyprland to 0.56.2 (0.57.0 breaks EGL/OpenGL clients on this
  #    Ivy Bridge iGPU; see files/scripts/pin_hyprland.sh for details)
  - type: script
    scripts:
      - pin_hyprland.sh

  # 5. Copy Config Files
  - type: files
    files:
      - source: system
        destination: /

  # 6. Flatpak Configuration
  - type: default-flatpaks
    configurations:
      - container: system
        notify: false
        install:
          - com.github.tchx84.Flatseal
          - org.mozilla.firefox
          - org.gnome.Calculator

  # 7. Fonts
  - type: fonts
    fonts:
      nerd-fonts:
        - JetBrainsMono

  # 8. Systemd Services (SDDM & Tailscale disabled)
  - type: systemd
    system:
      enabled:
        - NetworkManager
      disabled:
        - tailscaled
        - bluetooth

  # 9. Customize OS Name
  - type: os-release
    properties:
      NAME: "GalihOS"
      PRETTY_NAME: "GalihOS (Lightweight Hyprland) x86_64"
      ID: "galihos"
      ID_LIKE: fedora
      VERSION_ID: "45"
      VARIANT: "Hyprland Edition"
      VARIANT_ID: "hyprland"
      DEFAULT_HOSTNAME: "GalihOS"

  # 10. Sign image
  - type: signing
